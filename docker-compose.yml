services:
  db:
    image: postgres:17.6
    container_name: kitsune-wallet-db
    restart: unless-stopped
    shm_size: 128mb
    env_file:
      - .env
    environment:
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=pt-BR'
      TZ: America/Sao_Paulo
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ghs}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10